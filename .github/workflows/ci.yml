name: build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    name: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            binary: target/release/hunin
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            binary: target/release/hunin
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-14
            platform: macos-arm64
            binary: target/release/hunin
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x64
            binary: target/release/hunin
            rust_target: x86_64-apple-darwin
          - os: windows-2025
            platform: windows-x64
            binary: target/release/hunin.exe
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: UI contract and transport tests
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: UI build
        id: ui-build
        working-directory: ui
        run: npm run build
      - name: UI tests
        working-directory: ui
        run: npm test
      - name: Core and SDK Rust tests
        if: always()
        run: cargo +stable test --locked --all
      - name: JavaScript SDK tests
        if: always()
        run: node --test sdk/javascript/sdk.test.mjs
      - name: Python SDK tests
        if: always()
        run: python -m unittest discover -s sdk/python
      - name: Go SDK tests
        if: always()
        working-directory: sdk/go
        run: go test ./...
      - name: Configure C and C++ SDK contract test
        id: c-configure
        if: always()
        run: cmake -S sdk/c -B sdk-c-build -DHUNIN_SDK_BUILD_TESTS=ON
      - name: Build C and C++ SDK contract test
        id: c-build
        if: always() && steps.c-configure.outcome == 'success'
        run: cmake --build sdk-c-build --config Release
      - name: Verify C and C++ SDK concurrency
        if: always() && steps.c-build.outcome == 'success'
        run: ctest --test-dir sdk-c-build -C Release --output-on-failure
      - name: Packaging integrity tests
        if: always()
        run: python -m unittest discover -s distribution -p "test_*.py"
      - name: Build native host executable
        if: always()
        id: build
        run: cargo +stable build --locked --release
      - name: Install verified native profiler
        if: always() && steps.build.outcome == 'success'
        id: samply
        run: python distribution/fetch_samply.py --platform ${{ matrix.platform }} --destination "${{ runner.temp }}/hunin-tools/samply" --github-env
      - name: Enable process profiling in the ephemeral Linux runner
        if: always() && runner.os == 'Linux' && steps.build.outcome == 'success'
        run: sudo sysctl kernel.perf_event_paranoid=1
      - name: Verify automatic native collection
        if: always() && steps.build.outcome == 'success' && steps.samply.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime native --output collector-evidence/native
      - name: Verify automatic Node collection
        if: always() && steps.build.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime node --output collector-evidence/node
      - name: Verify Go CPU profiling
        if: always() && steps.build.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime go-test --output collector-evidence/go-test
      - name: Verify Go execution tracing
        if: always() && steps.build.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime go-trace --output collector-evidence/go-trace
      - name: Install target Python sampling dependency
        id: vmprof
        if: always() && steps.build.outcome == 'success' && runner.os != 'Windows'
        run: python -m pip install vmprof==0.6.0
      - name: Verify CPU-progress Python stack sampling and native attribution gaps
        if: always() && steps.build.outcome == 'success'
        run: python -m unittest discover -s collectors/python -p test_cpu.py
      - name: Verify automatic CPython collection
        if: always() && steps.build.outcome == 'success' && (runner.os == 'Windows' || steps.vmprof.outcome == 'success')
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime cpython --executable python --output collector-evidence/cpython
      - name: Install checksum-pinned Bun
        id: bun
        if: always() && steps.build.outcome == 'success'
        run: python distribution/fetch_runtime.py bun --platform ${{ matrix.platform }} --destination "${{ runner.temp }}/hunin-tools/bun" --github-env
      - name: Verify automatic Bun collection
        if: always() && steps.bun.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime bun --executable "${{ env.HUNIN_TEST_BUN }}" --output collector-evidence/bun
      - name: Verify Bun SDK public API
        if: always() && steps.bun.outcome == 'success'
        env:
          HUNIN_SDK_TEST_RUNTIME: ${{ env.HUNIN_TEST_BUN }}
        run: node --test sdk/javascript/sdk.test.mjs
      - name: Verify Bun SDK bridge into canonical storage
        if: always() && steps.bun.outcome == 'success'
        run: cargo +stable test --locked --test sdk_contract bun_runtime_sdk_conforms -- --ignored --exact --nocapture
      - name: Install checksum-pinned Deno
        id: deno
        if: always() && steps.build.outcome == 'success'
        run: python distribution/fetch_runtime.py deno --platform ${{ matrix.platform }} --destination "${{ runner.temp }}/hunin-tools/deno" --github-env
      - name: Verify automatic Deno collection
        if: always() && steps.deno.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime deno --executable "${{ env.HUNIN_TEST_DENO }}" --output collector-evidence/deno
      - name: Verify Deno SDK public API
        if: always() && steps.deno.outcome == 'success'
        env:
          HUNIN_SDK_TEST_RUNTIME: ${{ env.HUNIN_TEST_DENO }}
          HUNIN_SDK_TEST_DENO: '1'
        run: node --test sdk/javascript/sdk.test.mjs
      - name: Verify Deno SDK bridge into canonical storage
        if: always() && steps.deno.outcome == 'success'
        run: cargo +stable test --locked --test sdk_contract deno_runtime_sdk_conforms -- --ignored --exact --nocapture
      - name: Verify installed JavaScript runtime worker collection
        if: always() && steps.build.outcome == 'success'
        run: node --test collectors/javascript/plan.test.mjs
      - name: Install checksum-pinned PyPy
        id: pypy
        if: always() && steps.build.outcome == 'success'
        run: python distribution/fetch_runtime.py pypy --platform ${{ matrix.platform }} --destination "${{ runner.temp }}/hunin-tools/pypy" --github-env
      - name: Prepare PyPy sampling dependency
        id: pypy-vmprof
        if: always() && steps.pypy.outcome == 'success' && runner.os != 'Windows'
        run: |
          python -c "import os,subprocess; subprocess.run([os.environ['HUNIN_TEST_PYPY'],'-m','ensurepip'],check=True)"
          python -c "import os,subprocess; subprocess.run([os.environ['HUNIN_TEST_PYPY'],'-m','pip','install','vmprof==0.6.0'],check=True)"
      - name: Verify automatic PyPy collection
        if: always() && steps.pypy.outcome == 'success' && (runner.os == 'Windows' || steps.pypy-vmprof.outcome == 'success')
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime pypy --executable "${{ env.HUNIN_TEST_PYPY }}" --output collector-evidence/pypy
      - name: Verify CPU-progress stack sampling with the actual PyPy interpreter
        if: always() && steps.pypy.outcome == 'success'
        run: python -c "import os,subprocess; subprocess.run([os.environ['HUNIN_TEST_PYPY'],'-m','unittest','discover','-s','collectors/python','-p','test_cpu.py'],check=True)"
      - name: Verify PyPy SDK public API
        if: always() && steps.pypy.outcome == 'success'
        run: python -c "import os,subprocess; subprocess.run([os.environ['HUNIN_TEST_PYPY'],'-m','unittest','discover','-s','sdk/python'],check=True)"
      - name: Verify PyPy SDK bridge into canonical storage
        if: always() && steps.pypy.outcome == 'success'
        run: cargo +stable test --locked --test sdk_contract pypy_runtime_sdk_conforms -- --ignored --exact --nocapture
      - name: Record GraalPy Intel Mac distribution exclusion
        if: always() && matrix.platform == 'macos-x64'
        run: |
          python -c "import os; open(os.environ['GITHUB_STEP_SUMMARY'],'a').write('GraalPy macOS x64: current upstream native distributions are unavailable; the Hunin app still targets Intel Macs. No GraalPy support is claimed for this cell. See docs/support.md.\n')"
      - name: Install checksum-pinned GraalPy Community
        id: graalpy
        if: always() && steps.build.outcome == 'success' && matrix.platform != 'macos-x64'
        run: python distribution/fetch_runtime.py graalpy --platform ${{ matrix.platform }} --destination "${{ runner.temp }}/hunin-tools/graalpy" --github-env
      - name: Verify automatic GraalPy collection
        if: always() && steps.graalpy.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime graalpy --executable "${{ env.HUNIN_TEST_GRAALPY }}" --output collector-evidence/graalpy
      - name: Verify GraalPy SDK public API
        if: always() && steps.graalpy.outcome == 'success'
        run: python -c "import os,subprocess; subprocess.run([os.environ['HUNIN_TEST_GRAALPY'],'-m','unittest','discover','-s','sdk/python'],check=True)"
      - name: Verify GraalPy SDK bridge into canonical storage
        if: always() && steps.graalpy.outcome == 'success'
        run: cargo +stable test --locked --test sdk_contract graalpy_runtime_sdk_conforms -- --ignored --exact --nocapture
      - name: Assemble host bundle
        id: bundle
        if: always() && steps.build.outcome == 'success' && steps.ui-build.outcome == 'success'
        run: python distribution/package.py --binary ${{ matrix.binary }} --platform ${{ matrix.platform }} --output dist --rust-toolchain stable --rust-target ${{ matrix.rust_target }}
      - name: Verify installed CLI, MCP, SDK, durable analyzer, comparison and adjacent UI
        id: installed
        if: always() && steps.bundle.outcome == 'success'
        run: python -c "from pathlib import Path; import subprocess,sys; archives=[p for p in Path('dist').iterdir() if p.name.endswith(('.tar.gz','.zip'))]; assert len(archives)==1,archives; subprocess.run([sys.executable,'distribution/verify_install.py','--archive',str(archives[0]),'--output','collector-evidence/installed-bundle'],check=True)"
      - name: Verify installed C SDK context around automatically sampled native work
        if: always() && steps.installed.outcome == 'success' && steps.samply.outcome == 'success'
        run: python -c "from pathlib import Path; import subprocess,sys; roots=list(Path('collector-evidence/installed-bundle/installed').iterdir()); assert len(roots)==1,roots; subprocess.run([sys.executable,'distribution/verify_native_sdk.py','--installed',str(roots[0]),'--output','collector-evidence/installed-native-sdk'],check=True)"
      - uses: actions/cache/save@v4
        if: always() && steps.build.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-evidence-${{ matrix.platform }}
          path: collector-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.bundle.outcome == 'success'
        with:
          name: hunin-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
