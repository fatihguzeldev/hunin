name: build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            binary: target/release/hunin
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            binary: target/release/hunin
          - os: macos-14
            platform: macos-arm64
            binary: target/release/hunin
          - os: macos-15-intel
            platform: macos-x64
            binary: target/release/hunin
          - os: windows-2025
            platform: windows-x64
            binary: target/release/hunin.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: UI contract and transport tests
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: UI build
        working-directory: ui
        run: npm run build
      - name: UI tests
        working-directory: ui
        run: npm test
      - name: Core and SDK Rust tests
        run: cargo +stable test --locked --all
      - name: JavaScript SDK tests
        run: node --test sdk/javascript/sdk.test.mjs
      - name: Python SDK tests
        run: python -m unittest discover -s sdk/python
      - name: Go SDK tests
        working-directory: sdk/go
        run: go test ./...
      - name: Configure C and C++ SDK contract test
        run: cmake -S sdk/c -B sdk-c-build -DHUNIN_SDK_BUILD_TESTS=ON
      - name: Build C and C++ SDK contract test
        run: cmake --build sdk-c-build --config Release
      - name: Verify C and C++ SDK concurrency
        run: ctest --test-dir sdk-c-build -C Release --output-on-failure
      - name: Packaging integrity tests
        run: python -m unittest discover -s distribution -p "test_*.py"
      - name: Build native host executable
        id: build
        run: cargo +stable build --locked --release
      - name: Install verified native profiler
        id: samply
        run: python distribution/fetch_samply.py --platform ${{ matrix.platform }} --destination "${{ runner.temp }}/hunin-tools/samply" --github-env
      - name: Enable process profiling in the ephemeral Linux runner
        if: runner.os == 'Linux'
        run: sudo sysctl kernel.perf_event_paranoid=1
      - name: Verify automatic native collection
        if: always() && steps.build.outcome == 'success' && steps.samply.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime native --output collector-evidence/native
      - name: Verify automatic Node collection
        if: always() && steps.build.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime node --output collector-evidence/node
      - name: Verify Go CPU profiling
        if: always() && steps.build.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime go-test --output collector-evidence/go-test
      - name: Verify Go execution tracing
        if: always() && steps.build.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime go-trace --output collector-evidence/go-trace
      - name: Install target Python sampling dependency
        id: vmprof
        if: always() && steps.build.outcome == 'success'
        run: python -m pip install vmprof==0.6.0
      - name: Verify automatic CPython collection
        if: always() && steps.build.outcome == 'success' && steps.vmprof.outcome == 'success'
        run: python collectors/verify.py --binary ${{ matrix.binary }} --runtime cpython --executable python --output collector-evidence/cpython
      - name: Assemble host bundle
        if: always() && steps.build.outcome == 'success'
        run: python distribution/package.py --binary ${{ matrix.binary }} --platform ${{ matrix.platform }} --output dist
      - uses: actions/cache/save@v4
        if: always() && steps.build.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-evidence-${{ matrix.platform }}
          path: collector-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: hunin-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
