name: Linux native observer probe

on:
  push:
    paths:
      - .github/workflows/linux-native-observer-probe.yml
      - collectors/native/patches/0013-*.patch

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Linux native observer health
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin the failed capture compiler
        run: |
          mkdir -p observer-evidence
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustc +1.99.1 --version --verbose > observer-evidence/rustc.txt
          uname -a > observer-evidence/host.txt
          getconf CLK_TCK > observer-evidence/clock-tick-hz.txt
      - name: Download only the intact 51c Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: hunin-linux-x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '40960800501'
          path: ${{ runner.temp }}/hunin-observer-prior
      - name: Verify prior identities and install unchanged main and assets
        shell: python
        env:
          HUNIN_PROBE_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, pathlib, shutil, sys, tarfile, urllib.request
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from distribution.install import install, verify

          evidence = pathlib.Path('observer-evidence')
          source_head = '51c1d8686fbb76dfe12d8f8591c9ad89988be793'
          api = os.environ['GITHUB_API_URL']
          repository = os.environ['GITHUB_REPOSITORY']
          request = urllib.request.Request(
              f'{api}/repos/{repository}/actions/artifacts/12935628639',
              headers={'Authorization': 'Bearer ' + os.environ['HUNIN_PROBE_TOKEN'],
                       'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(65537)
          assert len(data) <= 65536, 'Unexpectedly large artifact metadata'
          artifact = json.loads(data)
          assert artifact['id'] == 12935628639 and artifact['name'] == 'hunin-linux-x64'
          assert artifact['workflow_run']['id'] == 40960800501
          assert artifact['workflow_run']['head_sha'] == source_head
          assert artifact['digest'] == 'sha256:bce441a91a8b21faaec753d6a6bacda199f765ccfa5eb5d85c786c9dbf41fe0d'
          (evidence / 'source-artifact.json').write_text(json.dumps(artifact, indent=2) + '\n')
          prior = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hunin-observer-prior'
          archive = prior / 'hunin-0.1.0-linux-x64.tar.gz'
          with archive.open('rb') as source:
              archive_sha = hashlib.file_digest(source, 'sha256').hexdigest()
          assert archive_sha == 'fd11a9ba3bd5f48e662724b81844d19aa33ee95c0c77824470cbc07d938bddc5'
          checksum = archive.with_name(archive.name + '.sha256').read_text()
          assert checksum.strip() == f'{archive_sha}  {archive.name}'
          extracted = prior / 'extracted'
          with tarfile.open(archive) as bundle:
              bundle.extractall(extracted, filter='data')
          bundle = extracted / 'hunin-0.1.0-linux-x64'
          manifest = verify(bundle)
          assert manifest['platform'] == 'linux-x64'
          assert manifest['build_provenance']['github_sha'] == source_head
          assert manifest['build_provenance']['packaging_checkout_revision'] == source_head
          assert manifest['build_provenance']['workflow_run_url'].endswith('/actions/runs/40960800501')
          main = install(bundle, prior / 'installed')
          (evidence / 'retained-main-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (evidence / 'retained-main-input.json').write_text(json.dumps({
              'archive_sha256': archive_sha, 'main_sha256': manifest['files']['hunin']['sha256'],
              'installed_main': str(main), 'source_head': source_head,
              'scope': 'Intact prior main/assets; only the explicit external native override will change.',
          }, indent=2) + '\n')
          expected = {
              'collectors/native/verify_lifetimes.py': '184b97875417dae98d5f922c5b3127011a73d2299c4f9aafb1f8c6554c8692ed',
              'collectors/native/acceptance/lifetimes.py': '6638399541a4c919873932e7405a18a7b5ce29800a2108a47fd774ef66ae7192',
              'collectors/native/acceptance/clock.py': '0e77f1dac323f6ef7b56e60c36096e4618aaf48e49372950485e683244230d8c',
              'collectors/native/fixtures/lifetimes/CMakeLists.txt': '5cb31f0ecd4d58e85980b72a8f2d37ea508b9c66b57d0971e6115f2a08b1408a',
              'collectors/native/fixtures/lifetimes/main.cpp': '0b05652d724582dd239ff12872f5f678f37386571608ca2979117ccaebb75ead',
              'collectors/native/fixtures/lifetimes/phase.cpp': 'fcba167a085b7bcbe8cfb600de75b68f71ee968c3d37fe88fa9b18161ebf65b6',
          }
          for name, digest in expected.items():
              path = pathlib.Path(name)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              destination = evidence / 'source' / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, destination)
          patches = list(pathlib.Path('collectors/native/patches').glob('0013-*.patch'))
          assert len(patches) == 1, 'Expected exactly one diagnostic 0013 patch'
          shutil.copytree('collectors/native/patches', evidence / 'source/native-patches')
          shutil.copy2('collectors/native/manifest.json', evidence / 'source/native-manifest.json')
          for name in ['.github/workflows/linux-native-observer-probe.yml',
                       'collectors/native/build.py', 'collectors/native/downstream/build.py',
                       'collectors/native/downstream/checks.py']:
              destination = evidence / 'source' / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(name, destination)
          (evidence / 'unchanged-control-hashes.json').write_text(json.dumps(expected, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'HUNIN_OBSERVER_MAIN={main.resolve()}\n')
      - name: Restore native source and build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hunin-native-cache
          key: ${{ runner.os }}-${{ runner.arch }}-samply-${{ hashFiles('collectors/native/manifest.json', 'collectors/native/patches/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-samply-
      - name: Build only the diagnostic native collector
        run: python collectors/native/build.py --output observer-evidence/native/samply --cache "${{ runner.temp }}/hunin-native-cache" --rust-toolchain 1.99.1 --github-env
      - name: Check the explicit native override compatibility
        shell: python
        run: |
          import hashlib, json, os, pathlib

          main = pathlib.Path(os.environ['HUNIN_OBSERVER_MAIN'])
          sampler = pathlib.Path(os.environ['HUNIN_SAMPLY'])
          pinned = json.loads((main.parent / 'collectors/native/manifest.json').read_text())
          receipt = json.loads(sampler.with_name('samply.provenance.json').read_text())
          assert receipt['version'] == pinned['version']
          assert receipt['identity']['upstream'] == pinned['upstream']
          assert receipt['extension'] == pinned['extension']
          assert receipt['target'] == 'x86_64-unknown-linux-gnu'
          assert receipt['rustc'].startswith('rustc 1.99.1 ')
          assert receipt['patch_sha256'] == '7c0c9116600f0a063dc50a0ff94d6760c9c314efb6924395a8f4ec051bf666be'
          assert receipt['source_sha256'] == '6792bf216f0ea3bd4b0de098764f18a4273ebf3efb9b6af8eccb2f4995937e7d'
          assert sum(p['name'].startswith('0013-') for p in receipt['identity']['patches']) == 1
          diagnostic = next(p for p in receipt['identity']['patches'] if p['name'].startswith('0013-'))
          assert diagnostic['sha256'] == 'dd68f1d3f4d3232c29e3a5e9332e8214f548e514bc241e05a379ace45e20da4c'
          with sampler.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == receipt['binary_sha256']
          assert sampler.resolve() != (main.parent / 'collectors/native/bin/samply').resolve()
      - name: Enable the same Linux perf permissions
        run: sudo sysctl kernel.perf_event_paranoid=1
      - name: Run the existing strict lifetime control once
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys

          path = pathlib.Path('observer-evidence/strict-verifier.log')
          with path.open('w+b') as log:
              result = subprocess.run([
                  sys.executable, 'collectors/native/verify_lifetimes.py',
                  '--binary', os.environ['HUNIN_OBSERVER_MAIN'],
                  '--sampler', os.environ['HUNIN_SAMPLY'],
                  '--output', 'observer-evidence/lifetimes',
              ], stdout=log, stderr=subprocess.STDOUT)
              log.seek(0)
              shutil.copyfileobj(log, sys.stdout.buffer)
          sys.exit(result.returncode)
      - name: Retain bounded observer, loss and clock summary
        if: always()
        shell: python
        run: |
          import collections, hashlib, json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from distribution.install import verify

          evidence = pathlib.Path('observer-evidence')
          evidence.mkdir(exist_ok=True)
          captures = []
          for directory in evidence.glob('lifetimes/recordings/captures/*'):
              stderr = directory / 'stderr.txt'
              text = stderr.read_text(errors='replace') if stderr.is_file() else ''
              prefix = 'HUNIN_NATIVE_OBSERVER_HEALTH'
              health = [json.loads(line[len(prefix):].strip()) for line in text.splitlines() if line.startswith(prefix)]
              sidecars = list(directory.glob('*.lifetimes.json'))
              sidecar = json.loads(sidecars[0].read_text()) if len(sidecars) == 1 else {}
              events = sidecar.get('events', [])
              captures.append({
                  'run_id': directory.name, 'observer_health': health,
                  'observer_line_count': len(health),
                  'stderr_sha256': hashlib.sha256(stderr.read_bytes()).hexdigest() if stderr.is_file() else None,
                  'event_counts': dict(collections.Counter(e.get('kind') for e in events)),
                  'loss_events': [e for e in events if e.get('kind') == 'loss'],
                  'clock_reference': [e for e in events if e.get('kind') == 'clock_reference'],
                  'truncated': sidecar.get('truncated'),
                  'collector': sidecar.get('collector'), 'target_outcome': sidecar.get('target_outcome'),
              })
          main_path = os.environ.get('HUNIN_OBSERVER_MAIN')
          intact = bool(main_path) and verify(pathlib.Path(main_path).parent)
          report = {
              'scope': 'One diagnostic observation, not final product acceptance or a scheduling-cause proof.',
              'diagnostic_checkout_head': os.environ.get('GITHUB_SHA'),
              'clock_tick_hz': (evidence / 'clock-tick-hz.txt').read_text().strip() if (evidence / 'clock-tick-hz.txt').exists() else None,
              'retained_main_and_assets_intact': bool(intact),
              'captures': captures,
              'limitations': 'No warmup/retry/rate/buffer/stack/strict assertion changes. Untimed loss cannot localize affected records. Diagnostic timing can perturb the observer.',
          }
          (evidence / 'observer-summary.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if captures:
              assert len(captures) == 1 and len(captures[0]['observer_health']) == 1
      - name: Preserve the diagnostic and strict failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-observer-probe
          path: observer-evidence
          if-no-files-found: error
          retention-days: 14
