[package]
name = "hunin"
version = "0.1.0"
edition = "2024"
description = "profiling and observability for coding agents. (and developers too)"
repository = "https://github.com/fatihguzeldev/hunin"

[workspace]
members = ["sdk/rust"]
resolver = "3"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
flate2 = "1"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
sourcemap = { version = "9.3.2", default-features = false }
wasmparser = { version = "=0.259.0", default-features = false, features = ["std", "features", "simd"] }

[dev-dependencies]
tempfile = "3"
hunin-sdk = { path = "sdk/rust" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Security", "Win32_Storage_FileSystem"] }
