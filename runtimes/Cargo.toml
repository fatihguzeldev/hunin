[package]
name = "hunin-runtimes"
version.workspace = true
edition.workspace = true

[dependencies]
hunin-core = { path = "../core" }
hunin-platforms = { path = "../platforms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sourcemap = { version = "=9.3.2", default-features = false }
flate2 = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
