[package]
name = "hunin-platforms"
version.workspace = true
edition.workspace = true

[dependencies]
hunin-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
regex = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Performance", "Win32_System_Diagnostics_Etw", "Win32_System_Time"] }

[dev-dependencies]
tempfile = "3"
