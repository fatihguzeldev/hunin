required-version = "==0.17.3"
target-version = "py39"
line-length = 88
force-exclude = true
extend-exclude = [
  "context",
  "target",
  "dist",
  "quality/.venv",
  # Captured source identity/line references are preserved independently.
  "src/importers/fixtures",
  "collectors/python/fixtures",
]

[per-file-target-version]
"collectors/**/*.py" = "py312"
"distribution/**/*.py" = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
